# Opt-in override for the geo-complete schema (PostGIS + pgvector).
#
#   docker compose -f compose.yaml -f compose.geo.yaml up -d --build
#
# The published postgis/postgis image is linux/amd64 only, so on ARM hosts this
# runs under emulation and the build is slow. The default compose.yaml uses the
# stock multi-arch postgres image and needs neither emulation nor pgvector.
services:
  db:
    image: postgis/postgis:16-3.5
    platform: linux/amd64
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/init-geo:/docker-entrypoint-initdb.d:ro
