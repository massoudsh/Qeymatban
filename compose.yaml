name: qeymatban

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-qeymatban}:${POSTGRES_PASSWORD:-qeymatban}@db:5432/${POSTGRES_DB:-qeymatban}
  QEYMATBAN_MODEL_PATH: /app/models/current.joblib
  QEYMATBAN_API_KEYS: ${QEYMATBAN_API_KEYS:-}
  QEYMATBAN_CORS_ORIGINS: ${QEYMATBAN_CORS_ORIGINS:-http://localhost:3000}

x-backend-volumes: &backend-volumes
  - models:/app/models
  - benchmarks:/app/benchmarks
  - appdata:/app/data

services:
  db:
    build:
      context: ./docker/db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qeymatban}
      POSTGRES_USER: ${POSTGRES_USER:-qeymatban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qeymatban}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qeymatban} -d ${POSTGRES_DB:-qeymatban}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment: *backend-env
    volumes: *backend-volumes
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      QEYMATBAN_API_URL: http://backend:8000
      QEYMATBAN_API_KEY: ${QEYMATBAN_API_KEY:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # One-off tasks that need CatBoost/LightGBM, e.g. the model benchmark.
  #   docker compose run --rm benchmark python -m app.scripts.benchmark_models ...
  benchmark:
    profiles: ["tools"]
    build:
      context: ./backend
      target: benchmark
    environment: *backend-env
    volumes: *backend-volumes
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  models:
  benchmarks:
  appdata:
